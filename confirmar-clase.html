<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Confirmar clase · Kingsbridge</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3efe3;color:#1d2033;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.w{max-width:560px;margin:0 auto;padding:20px}
.card{border-radius:22px;overflow:hidden;background:#fbf6e8;box-shadow:0 0 0 1px rgba(184,137,58,.55),0 20px 40px -26px rgba(10,18,48,.5)}
.hd{background:#0a1230;color:#fff;text-align:center;padding:24px 20px 20px;border-bottom:4px solid #e2ba68}
.hd small{display:block;font:600 11.5px/1.2 system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#e2ba68}
.hd h1{margin:8px 0 4px;font:500 1.7rem/1.15 Georgia,serif}
.hd p{margin:0;color:#c8cde6;font-size:.95rem}
form{padding:22px 20px 6px}
label{display:block;font-weight:600;font-size:14px;color:#0a1230;margin:0 0 6px}
input,textarea{width:100%;min-height:48px;padding:12px 14px;border:1.5px solid #d8c999;border-radius:14px;background:#fff;font:16px system-ui,sans-serif;color:#1d2033}
input:focus,textarea:focus{outline:3px solid rgba(226,186,104,.65);border-color:#b8893a}
.r{margin-bottom:16px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{display:block;width:100%;min-height:52px;border:0;border-radius:999px;font:700 16px system-ui,sans-serif;cursor:pointer;margin-bottom:12px}
.p{background:linear-gradient(180deg,#f0cd78,#d8a845);color:#0a1230}
.s{background:#0a1230;color:#e2ba68}
.o{padding:0 20px 20px;display:none}
.o.on{display:block}
textarea{min-height:190px;resize:vertical;line-height:1.4}
.inf{margin:0 0 14px;padding:10px 14px;border-radius:12px;background:#fff;border:1px dashed #d8c999;font-size:14px;color:#5a4a2a;display:none}.inf.on{display:block}
.e{color:#a3262a;font-weight:600;font-size:14px;min-height:1.3em;margin:0 0 10px}
.m{font-size:13px;color:#5a4a2a;text-align:center;margin:0;padding:0 20px 20px}
</style>
</head>
<body>
<div class="w"><div class="card">
<div class="hd"><small>Solo para ti</small><h1>Confirmar clase</h1><p>Genera el mensaje con el enlace al calendario.</p></div>
<form id="f" novalidate>
<p class="inf" id="inf"></p>
<div class="g r"><div><label for="n">Estudiante o tutor</label><input id="n" type="text" maxlength="60"></div><div><label for="w">WhatsApp</label><input id="w" type="tel" inputmode="tel" maxlength="20" placeholder="300 123 4567"></div></div>
<div class="g r"><div><label for="d">Fecha</label><input id="d" type="date"></div><div><label for="h">Hora</label><input id="h" type="time"></div></div>
<div class="g r"><div><label for="du">Duración (min)</label><input id="du" type="number" min="15" max="240" step="15" value="60"></div><div><label for="l">Lugar</label><input id="l" type="text" maxlength="80" placeholder="Barrio o dirección"></div></div>
<p class="e" id="e" role="alert"></p>
<button class="p" type="submit">Crear mensaje</button>
</form>
<div class="o" id="o">
<label for="t">Mensaje para WhatsApp</label>
<textarea id="t"></textarea>
<button class="p" type="button" id="wa" style="margin-top:12px">Enviar por WhatsApp</button>
<button class="s" type="button" id="c">Copiar mensaje</button>
<button class="s" type="button" id="i">Descargar archivo para tu calendario (.ics)</button>
<a id="g" target="_blank" rel="noopener" style="display:block;text-align:center;color:#0a1230;font-weight:600;margin-bottom:8px">Abrir en mi Google Calendar</a>
</div>
<p class="m">Hora de Colombia (Leticia). El enlace agrega la clase al calendario de quien lo toque.</p>
</div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},cur={};
function p2(n){return(n<10?"0":"")+n}
function stamp(d,h,addMin){var a=d.split("-"),b=h.split(":"),t=new Date(Date.UTC(+a[0],a[1]-1,+a[2],+b[0],+b[1]+addMin));
return t.getUTCFullYear()+p2(t.getUTCMonth()+1)+p2(t.getUTCDate())+"T"+p2(t.getUTCHours())+p2(t.getUTCMinutes())+"00"}
function nice(d,h){var a=d.split("-"),b=h.split(":"),t=new Date(Date.UTC(+a[0],a[1]-1,+a[2]));
var s=new Intl.DateTimeFormat("es-CO",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"}).format(t);
var hh=+b[0],ap=hh>=12?"p. m.":"a. m.",h12=hh%12||12;return s+" a las "+h12+":"+b[1]+" "+ap}
$("f").addEventListener("submit",function(e){e.preventDefault();
var n=$("n").value.trim(),d=$("d").value,h=$("h").value,du=parseInt($("du").value,10)||60,l=$("l").value.trim();
if(!n||!d||!h||!l){$("e").textContent="Completa nombre, fecha, hora y lugar.";return}
$("e").textContent="";
var ti="Primera clase con evaluación · Kingsbridge English Academy",
de="Clase a domicilio. La confirmación y el valor se acordaron por WhatsApp.",
s=stamp(d,h,0),en=stamp(d,h,du);
var g="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(ti)+"&dates="+s+"/"+en+"&ctz=America%2FBogota&location="+encodeURIComponent(l)+"&details="+encodeURIComponent(de);
cur={s:s,su:stamp(d,h,300)+"Z",eu:stamp(d,h,du+300)+"Z",ti:ti,l:l,de:de};
$("t").value="Estimado(a) "+n+":\n\nLe confirmamos la primera clase con evaluación, a domicilio, programada para el "+nice(d,h)+", en "+l+".\n\nPuede agregarla a su calendario con el siguiente enlace:\n"+g+"\n\nSi requiere algún cambio, le agradecemos avisarnos por este medio.\n\nCordialmente,\nKingsbridge English Academy";
$("g").href=g;$("o").className="o on";$("o").scrollIntoView({behavior:"smooth"})});

(function(){var q=new URLSearchParams(location.search),g=function(k){return(q.get(k)||"").trim()};
if(g("n"))$("n").value=g("n");if(g("w"))$("w").value=g("w");if(g("l"))$("l").value=g("l");
var inf=[];if(g("e"))inf.push("Edad: "+g("e"));if(g("d"))inf.push("Día preferido: "+g("d"));
if(inf.length){$("inf").textContent="Solicitud recibida. "+inf.join(" · ");$("inf").className="inf on"}})();
function waNum(v){var d=(v||"").replace(/\D/g,"");if(d.length===10&&d.charAt(0)==="3")d="57"+d;return d}
$("wa").addEventListener("click",function(){var d=waNum($("w").value);
if(d.length<11){$("e").textContent="Escribe el WhatsApp del padre o tutor para abrir el chat.";$("e").scrollIntoView({behavior:"smooth"});return}
var u="https://wa.me/"+d+"?text="+encodeURIComponent($("t").value);var w=window.open(u,"_blank");if(!w)location.href=u});
$("c").addEventListener("click",function(){var t=$("t");t.select();
var ok=function(){$("c").textContent="¡Copiado!";setTimeout(function(){$("c").textContent="Copiar mensaje"},1800)};
if(navigator.clipboard){navigator.clipboard.writeText(t.value).then(ok,function(){document.execCommand("copy");ok()})}else{document.execCommand("copy");ok()}});
$("i").addEventListener("click",function(){
function esc(x){return x.replace(/[\\;,]/g,"\\$&").replace(/\n/g,"\\n")}
var ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Kingsbridge//ES","BEGIN:VEVENT","UID:"+cur.s+"-"+Math.random().toString(36).slice(2)+"@kingsbridge","DTSTAMP:"+new Date().toISOString().replace(/[-:]|\.\d+/g,""),"DTSTART:"+cur.su,"DTEND:"+cur.eu,"SUMMARY:"+esc(cur.ti),"LOCATION:"+esc(cur.l),"DESCRIPTION:"+esc(cur.de),"END:VEVENT","END:VCALENDAR"].join("\r\n");
var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="primera-clase.ics";document.body.appendChild(a);a.click();a.remove()});
})();
</script>
</body>
</html>
