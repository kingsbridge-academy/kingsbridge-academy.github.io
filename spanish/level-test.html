:root{--bg:#080b19;--card:#11162b;--navy:#161d4a;--gold:#e2ba68;--gold2:#f3d58a;--gold3:#b8893a;--sil:#a9b7d6;--txt:#d8d4ee;--mute:#a09ac0;--ink:#ffffff;--panel:rgba(17,22,43,.86);--serif:"KB Lora",Georgia,"Times New Roman",serif;--sans:"KB Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 14px 28px}

<script>

// BANK: subset of the academy's own question bank (Cambridge-style). KIDS: o[0] is the correct answer.
const BANK=[{"l": "A1", "s": "c", "id": "A1-01", "tema": "Verb ser", "tipo": "Cloze", "q": "Mi hermana ____ profesora.", "o": ["es", "soy", "eres", "son"], "c": 0, "e": "With mi hermana (she) the verb is es.", "x": "Mi hermana es muy simpática.", "tip": "yo soy · tú eres · él/ella es · nosotros somos · ellos son.", "w": {"1": ["Soy goes only with yo (I).", "Yo soy estudiante."], "2": ["Eres goes with tú (you).", "Tú eres mi amigo."], "3": ["Son is for plural subjects (they).", "Ellos son altos."]}}, {"l": "A1", "s": "c", "id": "A1-02", "tema": "Verb tener", "tipo": "Cloze", "q": "Yo ____ dos gatos.", "o": ["tengo", "tiene", "tienes", "tenemos"], "c": 0, "e": "With yo (I) the verb is tengo.", "x": "Yo tengo una hermana.", "tip": "yo tengo · tú tienes · él/ella tiene · nosotros tenemos.", "w": {"1": ["Tiene goes with él/ella/usted.", "Ella tiene un perro."], "2": ["Tienes goes with tú (you).", "Tú tienes una bicicleta."], "3": ["Tenemos goes with nosotros (we).", "Nosotros tenemos una casa."]}}, {"l": "A1", "s": "c", "id": "A1-03", "tema": "Articles", "tipo": "Cloze", "q": "____ casa es grande.", "o": ["La", "El", "Los", "Las"], "c": 0, "e": "Casa is feminine and singular, so the article is la.", "x": "La mesa es nueva.", "tip": "el/los + masculine · la/las + feminine.", "w": {"1": ["El is for masculine nouns, and casa is feminine.", "El libro es nuevo."], "2": ["Los is masculine plural.", "Los libros son nuevos."], "3": ["Las is feminine plural, but casa is singular.", "Las casas son grandes."]}}, {"l": "A1", "s": "c", "id": "A1-04", "tema": "Ser vs estar", "tipo": "Cloze", "q": "Madrid ____ en España.", "o": ["está", "es", "están", "soy"], "c": 0, "e": "To say where something is located we use estar.", "x": "Mi casa está cerca del río.", "tip": "estar = where something is or how someone feels · ser = who/what something is.", "w": {"1": ["Es is for identity and description, not for location.", "Madrid es una ciudad grande."], "2": ["Están is plural, but Madrid is singular.", "Mis llaves están en la mesa."], "3": ["Soy goes with yo (I).", "Yo soy de Colombia."]}}, {"l": "A1", "s": "c", "id": "A1-05", "tema": "Gender agreement", "tipo": "Cloze", "q": "Mi amiga es ____.", "o": ["alta", "alto", "altos", "altas"], "c": 0, "e": "Amiga is feminine singular, so the adjective is alta.", "x": "Mi madre es alta.", "tip": "Adjectives agree: alto/alta (singular) · altos/altas (plural).", "w": {"1": ["Alto is masculine.", "Mi hermano es alto."], "2": ["Altos is masculine plural.", "Mis primos son altos."], "3": ["Altas is feminine plural, but amiga is singular.", "Mis amigas son altas."]}}, {"l": "A1", "s": "c", "id": "A1-06", "tema": "Present tense -ar", "tipo": "Cloze", "q": "Nosotros ____ en la escuela.", "o": ["estudiamos", "estudio", "estudian", "estudias"], "c": 0, "e": "With nosotros (we), -ar verbs end in -amos.", "x": "Nosotros hablamos español.", "tip": "-ar verbs: -o, -as, -a, -amos, -an.", "w": {"1": ["Estudio goes with yo (I).", "Yo estudio por la noche."], "2": ["Estudian goes with ellos/ustedes.", "Ellos estudian mucho."], "3": ["Estudias goes with tú (you).", "Tú estudias inglés."]}}, {"l": "A1", "s": "c", "id": "A1-07", "tema": "Question words", "tipo": "Cloze", "q": "¿____ te llamas?", "o": ["Cómo", "Dónde", "Cuándo", "Quién"], "c": 0, "e": "To ask for someone's name we say ¿Cómo te llamas?", "x": "¿Cómo te llamas? Me llamo Ana.", "tip": "cómo = how · dónde = where · cuándo = when · quién = who.", "w": {"1": ["Dónde asks about a place.", "¿Dónde vives?"], "2": ["Cuándo asks about time.", "¿Cuándo es la fiesta?"], "3": ["Quién asks about a person.", "¿Quién es ella?"]}}, {"l": "A1", "s": "c", "id": "A1-08", "tema": "Numbers", "tipo": "Cloze", "q": "Una semana tiene ____ días.", "o": ["siete", "cinco", "diez", "doce"], "c": 0, "e": "A week has seven days: siete.", "x": "Hay siete días en una semana.", "tip": "cinco 5 · siete 7 · diez 10 · doce 12.", "w": {"1": ["Cinco means five.", "Tengo cinco lápices."], "2": ["Diez means ten.", "Tengo diez dedos."], "3": ["Doce means twelve.", "Un año tiene doce meses."]}}, {"l": "A1", "s": "c", "id": "A1-09", "tema": "Vocabulary", "tipo": "Cloze", "q": "Bebo ____ cuando tengo sed.", "o": ["agua", "pan", "silla", "libro"], "c": 0, "e": "We drink water when we are thirsty: agua.", "x": "Bebo agua todos los días.", "tip": "agua = water · pan = bread · silla = chair · libro = book.", "w": {"1": ["Pan means bread, and we eat it, not drink it.", "Como pan con queso."], "2": ["Silla means chair.", "Me siento en la silla."], "3": ["Libro means book.", "Leo un libro."]}}, {"l": "A1", "s": "c", "id": "A1-10", "tema": "Verb gustar", "tipo": "Cloze", "q": "A mí me ____ las manzanas.", "o": ["gustan", "gusta", "gusto", "gustas"], "c": 0, "e": "Gustar agrees with the thing you like. Las manzanas is plural, so gustan.", "x": "Me gustan los perros.", "tip": "me gusta + singular · me gustan + plural.", "w": {"1": ["Gusta is for one thing (singular).", "Me gusta la pizza."], "2": ["Gusto is the form for yo, which is not used with me gusto here.", "Tengo mucho gusto en conocerte."], "3": ["Gustas is for tú, not for things.", "Me gustas tú."]}}, {"l": "A1", "s": "c", "id": "A1-11", "tema": "Possessives", "tipo": "Cloze", "q": "Tengo una hermana. ____ hermana se llama Rosa.", "o": ["Mi", "Mis", "Mía", "Yo"], "c": 0, "e": "Before a singular noun, my is mi.", "x": "Mi madre se llama Elena.", "tip": "mi + singular · mis + plural · tu/tus · su/sus.", "w": {"1": ["Mis is for plural nouns.", "Mis hermanas se llaman Rosa y Ana."], "2": ["Mía is used after the noun or alone, not before it.", "Esta casa es mía."], "3": ["Yo is a subject pronoun, not a possessive.", "Yo me llamo Pedro."]}}, {"l": "A1", "s": "c", "id": "A1-12", "tema": "Days of the week", "tipo": "Cloze", "q": "Hoy ____ lunes.", "o": ["es", "está", "hay", "tiene"], "c": 0, "e": "Days and dates use ser: hoy es lunes.", "x": "Hoy es martes.", "tip": "Hoy es + day · Mañana es + day.", "w": {"1": ["Está is not used for days of the week.", "Mi libro está en la mesa."], "2": ["Hay means there is/there are.", "Hay un libro en la mesa."], "3": ["Tiene means he/she has.", "Ella tiene un libro."]}}, {"l": "A1", "s": "c", "id": "A1-13", "tema": "Greetings", "tipo": "Cloze", "q": "Por la mañana digo: «Buenos ____».", "o": ["días", "noches", "tardes", "horas"], "c": 0, "e": "In the morning we say buenos días.", "x": "Buenos días, profesor.", "tip": "buenos días (morning) · buenas tardes (afternoon) · buenas noches (night).", "w": {"1": ["Buenas noches is for the night, and noches is feminine.", "Buenas noches, mamá."], "2": ["Buenas tardes is for the afternoon, and tardes is feminine.", "Buenas tardes, señor."], "3": ["Buenas horas is not a greeting.", "Tengo clase a las ocho horas."]}}, {"l": "A1", "s": "c", "id": "A1-14", "tema": "Plurals", "tipo": "Cloze", "q": "Tengo dos ____.", "o": ["libros", "libro", "libra", "libre"], "c": 0, "e": "After dos we need a plural noun: libros.", "x": "Tengo tres libros.", "tip": "Nouns ending in a vowel add -s: libro → libros.", "w": {"1": ["Libro is singular, but dos needs a plural.", "Tengo un libro."], "2": ["Libra is a different word (pound).", "Compro una libra de arroz."], "3": ["Libre is an adjective (free).", "Hoy estoy libre."]}}, {"l": "A2", "s": "c", "id": "A2-01", "tema": "Preterite", "tipo": "Cloze", "q": "El año pasado ____ a Colombia por primera vez.", "o": ["viajé", "viajaba", "viajo", "viajaré"], "c": 0, "e": "A single, completed event in the past uses the preterite: viajé.", "x": "Ayer comí con mi abuela.", "tip": "Preterite -ar: -é, -aste, -ó, -amos, -aron.", "w": {"1": ["The imperfect describes habits or background, not one event with por primera vez.", "De niño viajaba con mis padres."], "2": ["Viajo is present tense.", "Hoy viajo a Bogotá."], "3": ["Viajaré is future.", "Mañana viajaré a Lima."]}}, {"l": "A2", "s": "c", "id": "A2-02", "tema": "Reflexive verbs", "tipo": "Cloze", "q": "Todas las mañanas yo ____ a las siete.", "o": ["me levanto", "se levanta", "te levantas", "levanto"], "c": 0, "e": "Levantarse is reflexive. With yo we need me: me levanto.", "x": "Me ducho y me visto rápido.", "tip": "me · te · se · nos · se + verb.", "w": {"1": ["Se levanta goes with él/ella.", "Ella se levanta temprano."], "2": ["Te levantas goes with tú.", "Tú te levantas a las seis."], "3": ["Without me the verb loses its reflexive meaning (to get up).", "Levanto la mano."]}}, {"l": "A2", "s": "c", "id": "A2-03", "tema": "Present continuous", "tipo": "Cloze", "q": "Ahora mi madre ____ cocinando.", "o": ["está", "es", "hay", "tiene"], "c": 0, "e": "The present continuous is estar + -ando/-iendo: está cocinando.", "x": "Estoy leyendo un libro.", "tip": "estoy · estás · está + -ando / -iendo.", "w": {"1": ["Ser is not used to form the continuous.", "Mi madre es cocinera."], "2": ["Hay does not combine with a gerund this way.", "Hay una olla en la cocina."], "3": ["Tiene + gerund does not mean an action in progress.", "Ella tiene hambre."]}}, {"l": "A2", "s": "c", "id": "A2-04", "tema": "Mucho vs muy", "tipo": "Cloze", "q": "Hoy hace ____ calor.", "o": ["mucho", "muy", "mucha", "muchos"], "c": 0, "e": "Calor is a noun, so we use mucho. Muy goes before adjectives and adverbs.", "x": "Hace mucho frío.", "tip": "mucho + noun/verb · muy + adjective/adverb.", "w": {"1": ["Muy cannot go before a noun like calor.", "Es muy caliente."], "2": ["Mucha is feminine, but calor is masculine.", "Tengo mucha sed."], "3": ["Muchos is plural.", "Tengo muchos amigos."]}}, {"l": "A2", "s": "c", "id": "A2-05", "tema": "Object pronouns", "tipo": "Cloze", "q": "¿Ves a María? Sí, ____ veo.", "o": ["la", "lo", "las", "me"], "c": 0, "e": "María is feminine singular, so the direct object pronoun is la.", "x": "¿Compras el pan? Sí, lo compro.", "tip": "lo (m) · la (f) · los · las.", "w": {"1": ["Lo replaces a masculine noun.", "¿Ves el coche? Sí, lo veo."], "2": ["Las is for several feminine things.", "¿Ves a las niñas? Sí, las veo."], "3": ["Me means myself or to me, not María.", "Ella me ve."]}}, {"l": "A2", "s": "c", "id": "A2-06", "tema": "Ir a + infinitive", "tipo": "Cloze", "q": "Mañana ____ a visitar a mi abuela.", "o": ["voy", "fui", "fuiste", "ido"], "c": 0, "e": "The near future is ir a + infinitive: voy a visitar.", "x": "Voy a estudiar esta noche.", "tip": "voy · vas · va · vamos · van + a + infinitive.", "w": {"1": ["Fui is the past (preterite).", "Ayer fui al parque."], "2": ["Fuiste is past and goes with tú.", "Tú fuiste a la fiesta."], "3": ["Ido is a participle and cannot stand alone here.", "Ya he ido al mercado."]}}, {"l": "A2", "s": "c", "id": "A2-07", "tema": "Adjective apocope", "tipo": "Cloze", "q": "Es un ____ día para nadar.", "o": ["buen", "bueno", "buena", "bien"], "c": 0, "e": "Bueno shortens to buen before a masculine singular noun.", "x": "Es un buen libro.", "tip": "bueno → buen · malo → mal (before masculine singular nouns).", "w": {"1": ["Bueno is used after the noun or when it stands alone.", "Es un día bueno."], "2": ["Buena is feminine.", "Es una buena idea."], "3": ["Bien is an adverb, not an adjective.", "Ella canta bien."]}}, {"l": "A2", "s": "c", "id": "A2-08", "tema": "Stem-changing verbs", "tipo": "Cloze", "q": "Yo ____ a la una.", "o": ["almuerzo", "almorzo", "almorzas", "almorzar"], "c": 0, "e": "Almorzar changes o → ue in most present forms: almuerzo.", "x": "Yo duermo ocho horas.", "tip": "o → ue: almuerzo, duermo, puedo · e → ie: quiero, pienso.", "w": {"1": ["Almorzo is a regular form that does not exist.", "Yo no digo almorzo."], "2": ["Almorzas goes with tú.", "Tú almuerzas en la escuela."], "3": ["Almorzar is the infinitive, not a conjugated form.", "Voy a almorzar."]}}, {"l": "A2", "s": "w", "id": "A2-09", "tema": "Word formation", "tipo": "Word formation", "q": "La ____ es muy importante en la vida.", "k": "FELIZ", "sa": "La ____ es muy importante en la vida.", "o": ["felicidad", "felizmente", "felicito", "felizmento"], "c": 0, "e": "We need a noun after la: felicidad (happiness), formed from feliz.", "x": "La amistad es importante.", "tip": "adjective + -dad = noun: feliz → felicidad.", "w": {"1": ["Felizmente is an adverb.", "Vivimos felizmente."], "2": ["Felicito is a verb (I congratulate).", "Te felicito por tu éxito."], "3": ["Felizmento is not a Spanish word.", ""]}}, {"l": "A2", "s": "w", "id": "A2-10", "tema": "Word formation", "tipo": "Word formation", "q": "Hoy es un día muy ____.", "k": "SOL", "sa": "Hoy es un día muy ____.", "o": ["soleado", "solar", "solitario", "soldado"], "c": 0, "e": "Soleado (sunny) is the adjective formed from sol.", "x": "Es una mañana soleada.", "tip": "noun + -ado = adjective: sol → soleado.", "w": {"1": ["Solar means related to the sun and does not describe the weather like this.", "Uso energía solar."], "2": ["Solitario means lonely.", "Vive en un lugar solitario."], "3": ["Soldado means soldier.", "Mi tío es soldado."]}}, {"l": "A2", "s": "w", "id": "A2-11", "tema": "Word formation", "tipo": "Word formation", "q": "Hay mucha ____ en el centro hoy.", "k": "CONTAMINAR", "sa": "Hay mucha ____ en el centro hoy.", "o": ["contaminación", "contaminado", "contaminante", "contaminar"], "c": 0, "e": "After mucha we need a feminine noun: contaminación.", "x": "La contaminación afecta la salud.", "tip": "verb + -ción = noun: contaminar → contaminación.", "w": {"1": ["Contaminado is an adjective (polluted).", "El río está contaminado."], "2": ["Contaminante can be an adjective or a masculine noun, not a feminine noun.", "El humo es contaminante."], "3": ["Contaminar is a verb.", "No debemos contaminar el agua."]}}, {"l": "A2", "s": "t", "id": "A2-12", "tema": "Comparatives", "tipo": "Key word transformation", "q": "Mi casa es más grande que tu casa.\nTu casa es ____ mi casa.", "k": "MENOS", "sa": "Tu casa es ____ mi casa.", "o": ["menos grande que", "tan grande como", "más grande como", "menos grande como"], "c": 0, "e": "The opposite of más grande que is menos grande que.", "x": "Mi bolso es menos pesado que el tuyo.", "tip": "más … que ↔ menos … que · tan … como = equal.", "w": {"1": ["Tan grande como means equal size.", "Mi casa es tan grande como la tuya."], "2": ["Más grande como mixes two structures.", "Mi casa es más grande que la tuya."], "3": ["Menos … como mixes two structures: it is menos … que.", "Soy menos alto que mi padre."]}}, {"l": "A2", "s": "t", "id": "A2-13", "tema": "Desde hace", "tipo": "Key word transformation", "q": "Empecé a estudiar español hace dos años.\nEstudio español ____ dos años.", "k": "DESDE", "sa": "Estudio español ____ dos años.", "o": ["desde hace", "desde", "por", "en"], "c": 0, "e": "To say how long an action has lasted we use desde hace + time.", "x": "Vivo aquí desde hace cinco años.", "tip": "desde hace + period of time · desde + starting point.", "w": {"1": ["Desde alone needs a starting point, such as desde 2023.", "Vivo aquí desde 2023."], "2": ["Por is not used here with a present action that started in the past.", "Estudié por dos horas."], "3": ["En does not express duration since a past point.", "Lo hago en dos horas."]}}, {"l": "A2", "s": "t", "id": "A2-14", "tema": "Superlatives", "tipo": "Key word transformation", "q": "Pedro es más alto que todos.\nPedro es el ____ de todos.", "k": "MÁS", "sa": "Pedro es el ____ de todos.", "o": ["más alto", "muy alto", "tan alto", "altísimo"], "c": 0, "e": "The superlative is el más + adjective: el más alto.", "x": "María es la más simpática.", "tip": "el/la más + adjective + de.", "w": {"1": ["Muy alto is not a comparison with el.", "Pedro es muy alto."], "2": ["Tan alto needs como.", "Pedro es tan alto como Juan."], "3": ["Altísimo does not combine with el … de todos.", "Pedro es altísimo."]}}, {"l": "B1", "s": "c", "id": "B1-01", "tema": "Imperfect", "tipo": "Cloze", "q": "Cuando era niño, ____ al parque todos los días.", "o": ["iba", "fui", "voy", "he ido"], "c": 0, "e": "A habit in the past uses the imperfect: iba.", "x": "De niña, jugaba en la calle.", "tip": "imperfect -ar: -aba · -er/-ir: -ía. Irregular: ir → iba, ser → era, ver → veía.", "w": {"1": ["The preterite describes one finished event, not a repeated habit.", "Ayer fui al parque."], "2": ["Voy is present tense.", "Hoy voy al parque."], "3": ["He ido is present perfect and does not fit cuando era niño.", "He ido al parque hoy."]}}, {"l": "B1", "s": "c", "id": "B1-02", "tema": "Preterite vs imperfect", "tipo": "Cloze", "q": "Estaba duchándome cuando ____ el teléfono.", "o": ["sonó", "sonaba", "suena", "había sonado"], "c": 0, "e": "A sudden action that interrupts an ongoing one uses the preterite: sonó.", "x": "Leía cuando llegó mi madre.", "tip": "Imperfect = background · preterite = interrupting event.", "w": {"1": ["The imperfect would describe a second background action, not an interruption.", "Mientras comía, sonaba la música."], "2": ["Suena is present tense.", "Ahora suena el teléfono."], "3": ["Había sonado is pluperfect: it happened earlier than the shower.", "Cuando llegué, ya había sonado."]}}, {"l": "B1", "s": "c", "id": "B1-03", "tema": "Future after si", "tipo": "Cloze", "q": "Si tengo tiempo mañana, te ____.", "o": ["llamaré", "llamé", "llamaba", "llamara"], "c": 0, "e": "With si + present, the result clause uses the future: llamaré.", "x": "Si llueve, me quedaré en casa.", "tip": "si + present → future or present.", "w": {"1": ["Llamé is past.", "Ayer te llamé."], "2": ["Llamaba is imperfect and does not express a future result.", "Te llamaba todos los días."], "3": ["Llamara is imperfect subjunctive and does not follow si + present.", "Si yo tuviera tiempo, te llamara."]}}, {"l": "B1", "s": "c", "id": "B1-04", "tema": "Negative commands", "tipo": "Cloze", "q": "No ____ tarde, por favor. (tú)", "o": ["llegues", "llegas", "llegar", "llega"], "c": 0, "e": "A negative command to tú uses the subjunctive: no llegues.", "x": "No hables tan rápido.", "tip": "no + subjunctive: no hables, no comas, no vengas.", "w": {"1": ["Llegas is a statement, not a command.", "Tú llegas tarde."], "2": ["Llegar is the infinitive.", "Odio llegar tarde."], "3": ["Llega is the affirmative command (¡Llega temprano!).", "¡Llega temprano!"]}}, {"l": "B1", "s": "c", "id": "B1-05", "tema": "Subjunctive", "tipo": "Cloze", "q": "Quiero que tú ____ conmigo.", "o": ["vengas", "vienes", "vendrás", "vienen"], "c": 0, "e": "After querer que we use the subjunctive: vengas.", "x": "Quiero que hables despacio.", "tip": "querer que + subjunctive (when the subject changes).", "w": {"1": ["Vienes is indicative.", "Tú vienes conmigo."], "2": ["Vendrás is future indicative.", "Mañana vendrás conmigo."], "3": ["Vienen is indicative and goes with ellos.", "Ellos vienen conmigo."]}}, {"l": "B1", "s": "c", "id": "B1-06", "tema": "Relative pronouns", "tipo": "Cloze", "q": "El chico ____ vive aquí es mi primo.", "o": ["que", "donde", "cuyo", "cuál"], "c": 0, "e": "Que is the most common relative pronoun for people and things.", "x": "La casa que compré es grande.", "tip": "que = who / which / that.", "w": {"1": ["Donde is used for places.", "La casa donde vivo es grande."], "2": ["Cuyo means whose and agrees with the noun after it.", "El chico cuyo padre vive aquí es mi primo."], "3": ["Cuál is a question word.", "¿Cuál prefieres?"]}}, {"l": "B1", "s": "c", "id": "B1-07", "tema": "Polite conditional", "tipo": "Cloze", "q": "Me gustaría ____ un café, por favor.", "o": ["tomar", "tomo", "tomaré", "tomé"], "c": 0, "e": "Me gustaría is followed by an infinitive: me gustaría tomar.", "x": "Me gustaría viajar a Perú.", "tip": "me gustaría + infinitive.", "w": {"1": ["Tomo is conjugated, and me gustaría needs an infinitive.", "Tomo café por la mañana."], "2": ["Tomaré is future.", "Mañana tomaré café."], "3": ["Tomé is past.", "Ayer tomé café."]}}, {"l": "B1", "s": "c", "id": "B1-08", "tema": "Pronouns together", "tipo": "Cloze", "q": "—¿Me prestas tu libro? —Sí, ahora ____ presto.", "o": ["te lo", "se lo", "me lo", "lo te"], "c": 0, "e": "The indirect pronoun comes first: te (to you) + lo (the book).", "x": "Te lo doy mañana.", "tip": "indirect + direct: me lo, te lo, se lo, nos lo.", "w": {"1": ["Se lo is used for él/ella/ustedes, not for tú.", "Se lo doy a ella."], "2": ["Me lo would mean he lends it to me.", "Me lo prestas."], "3": ["Lo te has the pronouns in the wrong order.", ""]}}, {"l": "B1", "s": "w", "id": "B1-09", "tema": "Word formation", "tipo": "Word formation", "q": "Tiene mucha ____ para aprender idiomas.", "k": "FÁCIL", "sa": "Tiene mucha ____ para aprender idiomas.", "o": ["facilidad", "fácilmente", "fácil", "facilitar"], "c": 0, "e": "After mucha we need a noun: facilidad (ease, aptitude).", "x": "Tengo facilidad para el dibujo.", "tip": "adjective + -idad = noun: fácil → facilidad.", "w": {"1": ["Fácilmente is an adverb.", "Lo hizo fácilmente."], "2": ["Fácil is an adjective.", "Es un examen fácil."], "3": ["Facilitar is a verb.", "Esto facilita el trabajo."]}}, {"l": "B1", "s": "w", "id": "B1-10", "tema": "Word formation", "tipo": "Word formation", "q": "Su ____ nos sorprendió a todos.", "k": "LLEGAR", "sa": "Su ____ nos sorprendió a todos.", "o": ["llegada", "llegado", "llegue", "llegaron"], "c": 0, "e": "After su we need a noun: llegada (arrival).", "x": "Esperamos su llegada.", "tip": "verb + -ada = noun: llegar → llegada.", "w": {"1": ["Llegado is a participle.", "Ha llegado tarde."], "2": ["Llegue is a subjunctive form.", "Espero que llegue pronto."], "3": ["Llegaron is a verb form, so it cannot follow su.", "Ellos llegaron ayer."]}}, {"l": "B1", "s": "w", "id": "B1-11", "tema": "Word formation", "tipo": "Word formation", "q": "Estoy ____ con el resultado: esperaba más.", "k": "SATISFECHO", "sa": "Estoy ____ con el resultado: esperaba más.", "o": ["insatisfecho", "satisfecho", "satisfactorio", "satisfacción"], "c": 0, "e": "He expected more, so he is not happy: insatisfecho (dissatisfied).", "x": "Estamos satisfechos con el trabajo.", "tip": "prefix in- / des- = the opposite: satisfecho → insatisfecho.", "w": {"1": ["Satisfecho means satisfied, which contradicts esperaba más.", "Estoy satisfecho con mi nota."], "2": ["Satisfactorio describes things, not people.", "El resultado es satisfactorio."], "3": ["Satisfacción is a noun.", "Siento mucha satisfacción."]}}, {"l": "B1", "s": "t", "id": "B1-12", "tema": "Impersonal se", "tipo": "Key word transformation", "q": "La gente habla español en Colombia.\nEn Colombia ____ español.", "k": "SE", "sa": "En Colombia ____ español.", "o": ["se habla", "se hablan", "es hablar", "está hablado"], "c": 0, "e": "The impersonal se + singular verb gives a general statement: se habla español.", "x": "Aquí se vende pan.", "tip": "se + 3rd person singular (with a singular noun or infinitive).", "w": {"1": ["Se hablan would agree with a plural noun such as se hablan dos idiomas.", "Se hablan dos idiomas."], "2": ["Es hablar does not form a passive.", "Hablar es útil."], "3": ["Está hablado is not used for a general statement.", "El tema está hablado."]}}, {"l": "B1", "s": "t", "id": "B1-13", "tema": "Por vs para", "tipo": "Key word transformation", "q": "Fui a la tienda porque necesitaba pan.\nFui a la tienda ____ pan.", "k": "POR", "sa": "Fui a la tienda ____ pan.", "o": ["por", "para", "de", "en"], "c": 0, "e": "Por expresses the thing you go to get: ir por pan.", "x": "Voy por agua al pozo.", "tip": "ir por = to go and get.", "w": {"1": ["Para + noun would express a purpose or recipient, not what you go to fetch.", "Este pan es para ti."], "2": ["De does not express this meaning.", "Soy de Leticia."], "3": ["En does not express what you go to fetch.", "Estoy en la tienda."]}}, {"l": "B1", "s": "t", "id": "B1-14", "tema": "Concession", "tipo": "Key word transformation", "q": "Aunque llovía, salimos.\nSalimos ____ llovía.", "k": "PESAR", "sa": "Salimos ____ llovía.", "o": ["a pesar de que", "a pesar que", "a pesar", "pese"], "c": 0, "e": "The full concessive connector before a verb is a pesar de que.", "x": "Vino a pesar de que estaba enfermo.", "tip": "a pesar de + noun/infinitive · a pesar de que + verb.", "w": {"1": ["A pesar que is a common mistake: it needs de.", "No digas «a pesar que»."], "2": ["A pesar alone is incomplete.", "Salimos a pesar de la lluvia."], "3": ["Pese alone is incomplete; it needs a que.", "Pese a que llovía, salimos."]}}, {"l": "B2", "s": "c", "id": "B2-01", "tema": "Doubt + subjunctive", "tipo": "Cloze", "q": "Dudo que ____ a tiempo.", "o": ["llegue", "llega", "llegará", "llegaría"], "c": 0, "e": "Expressions of doubt take the subjunctive: dudo que llegue.", "x": "No creo que venga hoy.", "tip": "dudar que / no creer que + subjunctive.", "w": {"1": ["Llega is indicative.", "Sé que llega a tiempo."], "2": ["Llegará is future indicative.", "Creo que llegará a tiempo."], "3": ["Llegaría is conditional, which does not follow dudo que.", "Llegaría si pudiera."]}}, {"l": "B2", "s": "c", "id": "B2-02", "tema": "Second conditional", "tipo": "Cloze", "q": "Si yo ____ más tiempo, viajaría más.", "o": ["tuviera", "tendré", "tengo", "tenía"], "c": 0, "e": "An unreal present situation uses si + imperfect subjunctive: si tuviera.", "x": "Si fuera rico, compraría una isla.", "tip": "si + imperfect subjunctive → conditional.", "w": {"1": ["Tendré is future and cannot follow si here.", "Cuando tenga tiempo, viajaré."], "2": ["Tengo is present and would make a real condition.", "Si tengo tiempo, viajo."], "3": ["Tenía is imperfect indicative, not the subjunctive.", "Antes tenía más tiempo."]}}, {"l": "B2", "s": "c", "id": "B2-03", "tema": "Pluperfect", "tipo": "Cloze", "q": "Cuando llegué, el tren ya ____.", "o": ["había salido", "salió", "sale", "saldrá"], "c": 0, "e": "An action completed before another past action uses the pluperfect: había salido.", "x": "Cuando llamaste, ya había comido.", "tip": "había + past participle.", "w": {"1": ["Salió is simple past and does not show that it happened first.", "El tren salió a las ocho."], "2": ["Sale is present.", "El tren sale ahora."], "3": ["Saldrá is future.", "El tren saldrá mañana."]}}, {"l": "B2", "s": "c", "id": "B2-04", "tema": "Purpose", "tipo": "Cloze", "q": "Trabajo mucho ____ pagar mis estudios.", "o": ["para", "por", "a", "de"], "c": 0, "e": "Para + infinitive expresses purpose: para pagar.", "x": "Estudio para aprender.", "tip": "para + infinitive = in order to.", "w": {"1": ["Por + infinitive is not used for purpose in this sentence.", "Lo hizo por dinero."], "2": ["A does not express purpose here.", "Voy a trabajar."], "3": ["De does not express purpose here.", "Es hora de trabajar."]}}, {"l": "B2", "s": "c", "id": "B2-05", "tema": "Time clauses", "tipo": "Cloze", "q": "Te llamaré cuando ____ a casa.", "o": ["llegue", "llego", "llegaré", "llegué"], "c": 0, "e": "After cuando about the future we use the subjunctive: cuando llegue.", "x": "Te avisaré cuando termine.", "tip": "future + cuando + subjunctive.", "w": {"1": ["Llego would not match a future main clause.", "Siempre llamo cuando llego."], "2": ["Llegaré is future and is not used after cuando.", "Mañana llegaré a casa."], "3": ["Llegué is past.", "Te llamé cuando llegué."]}}, {"l": "B2", "s": "c", "id": "B2-06", "tema": "Ser vs estar", "tipo": "Cloze", "q": "La sopa ____ fría; ponla en el microondas.", "o": ["está", "es", "fue", "hay"], "c": 0, "e": "A temporary state of the soup uses estar: está fría.", "x": "El café está caliente.", "tip": "estar = temporary condition · ser = permanent trait.", "w": {"1": ["Es fría would describe a soup that is cold by nature.", "El gazpacho es frío."], "2": ["Fue is past.", "La sopa fue deliciosa."], "3": ["Hay does not link a noun with an adjective.", "Hay sopa fría."]}}, {"l": "B2", "s": "c", "id": "B2-07", "tema": "Passive voice", "tipo": "Cloze", "q": "Estas casas ____ en 1990.", "o": ["fueron construidas", "son construido", "construyeron", "han construido"], "c": 0, "e": "The passive is ser + participle that agrees: fueron construidas.", "x": "El puente fue construido en 1950.", "tip": "ser + participle (agrees with the subject).", "w": {"1": ["Son construido does not agree with a plural noun.", "Los puentes son construidos."], "2": ["Construyeron has no passive meaning and needs an object.", "Construyeron estas casas en 1990."], "3": ["Han construido is active and present perfect.", "Han construido estas casas."]}}, {"l": "B2", "s": "c", "id": "B2-08", "tema": "Relative pronouns", "tipo": "Cloze", "q": "La casa en ____ nací ya no existe.", "o": ["la que", "lo que", "los que", "cuyo"], "c": 0, "e": "After a preposition, the pronoun agrees with the noun: la casa → en la que.", "x": "La ciudad en la que vivo es pequeña.", "tip": "preposition + el/la/los/las que.", "w": {"1": ["Lo que refers to an idea, not to a noun.", "No entiendo lo que dices."], "2": ["Los que is masculine plural.", "Los que llegan tarde pagan."], "3": ["Cuyo means whose.", "El hombre cuyo hijo estudia aquí."]}}, {"l": "B2", "s": "w", "id": "B2-09", "tema": "Word formation", "tipo": "Word formation", "q": "Su ____ en el trabajo fue reconocida por todos.", "k": "DEDICAR", "sa": "Su ____ en el trabajo fue reconocida por todos.", "o": ["dedicación", "dedicado", "dedicatoria", "dedicar"], "c": 0, "e": "We need a noun meaning commitment: dedicación.", "x": "Admiro su dedicación.", "tip": "verb + -ción = noun: dedicar → dedicación.", "w": {"1": ["Dedicado is an adjective.", "Es un alumno dedicado."], "2": ["Dedicatoria is a written inscription in a book.", "La dedicatoria del libro es bonita."], "3": ["Dedicar is a verb.", "Voy a dedicar tiempo al estudio."]}}, {"l": "B2", "s": "w", "id": "B2-10", "tema": "Word formation", "tipo": "Word formation", "q": "Conducir sin cinturón es una conducta ____.", "k": "RESPONSABLE", "sa": "Conducir sin cinturón es una conducta ____.", "o": ["irresponsable", "responsable", "responsablemente", "responsabilizar"], "c": 0, "e": "Driving without a seat belt is not responsible: irresponsable.", "x": "Es una decisión irresponsable.", "tip": "prefix in-/ir- = the opposite: responsable → irresponsable.", "w": {"1": ["Responsable means responsible, which contradicts the context.", "Es una persona responsable."], "2": ["Responsablemente is an adverb.", "Condujo responsablemente."], "3": ["Responsabilizar is a verb.", "Lo responsabilizaron del error."]}}, {"l": "B2", "s": "w", "id": "B2-11", "tema": "Word formation", "tipo": "Word formation", "q": "Se expresó con gran ____.", "k": "ELOCUENTE", "sa": "Se expresó con gran ____.", "o": ["elocuencia", "elocuentemente", "elocuente", "elocuentes"], "c": 0, "e": "After gran we need a noun: elocuencia (eloquence).", "x": "Habló con elocuencia.", "tip": "adjective + -ia / -encia = noun: elocuente → elocuencia.", "w": {"1": ["Elocuentemente is an adverb.", "Habló elocuentemente."], "2": ["Elocuente is an adjective and cannot follow gran as a noun.", "Es un orador elocuente."], "3": ["Elocuentes is a plural adjective.", "Son oradores elocuentes."]}}, {"l": "B2", "s": "t", "id": "B2-12", "tema": "Concession with infinitive", "tipo": "Key word transformation", "q": "Aunque estaba cansado, siguió trabajando.\n____ cansado, siguió trabajando.", "k": "PESAR", "sa": "____ cansado, siguió trabajando.", "o": ["A pesar de estar", "A pesar de que estar", "Aunque estar", "Pese que estar"], "c": 0, "e": "A pesar de + infinitive replaces aunque + verb: a pesar de estar cansado.", "x": "A pesar de ser joven, es muy sabio.", "tip": "a pesar de + infinitive.", "w": {"1": ["A pesar de que needs a conjugated verb, not an infinitive.", "A pesar de que estaba cansado, siguió."], "2": ["Aunque cannot be followed by an infinitive.", "Aunque estaba cansado, siguió."], "3": ["Pese needs a, not que, before an infinitive.", "Pese a estar cansado, siguió."]}}, {"l": "B2", "s": "t", "id": "B2-13", "tema": "Third conditional", "tipo": "Key word transformation", "q": "No estudié y suspendí.\nSi hubiera estudiado, no ____.", "k": "SUSPENDER", "sa": "Si hubiera estudiado, no ____.", "o": ["habría suspendido", "suspendería", "suspendí", "habré suspendido"], "c": 0, "e": "An unreal past result uses the conditional perfect: habría suspendido.", "x": "Si hubiera sabido, habría venido.", "tip": "si + pluperfect subjunctive → habría + participle.", "w": {"1": ["Suspendería is present conditional.", "Si estudiara, no suspendería."], "2": ["Suspendí is simple past.", "Ayer suspendí el examen."], "3": ["Habré suspendido is future perfect.", "Para junio habré suspendido o aprobado."]}}, {"l": "B2", "s": "t", "id": "B2-14", "tema": "Passive voice", "tipo": "Key word transformation", "q": "Los obreros terminaron el puente.\nEl puente ____ por los obreros.", "k": "FUE", "sa": "El puente ____ por los obreros.", "o": ["fue terminado", "fue terminó", "terminó", "ha terminado"], "c": 0, "e": "The passive uses ser + participle: fue terminado.", "x": "La casa fue vendida por mi tío.", "tip": "ser + participle + por + agent.", "w": {"1": ["Fue terminó mixes ser with a conjugated verb.", ""], "2": ["Terminó is active and has no passive meaning.", "Los obreros terminaron el puente."], "3": ["Ha terminado is active.", "El puente ha terminado."]}}, {"l": "C1", "s": "c", "id": "C1-01", "tema": "Past hypothetical wish", "tipo": "Cloze", "q": "Me habría gustado que ____ más tiempo.", "o": ["hubiéramos tenido", "tuvimos", "tenemos", "habríamos tenido"], "c": 0, "e": "A past wish uses the pluperfect subjunctive: hubiéramos tenido.", "x": "Habría preferido que hubieras venido.", "tip": "habría + que + pluperfect subjunctive.", "w": {"1": ["Tuvimos is indicative preterite.", "Ayer tuvimos poco tiempo."], "2": ["Tenemos is present indicative.", "Hoy tenemos tiempo."], "3": ["Habríamos tenido is conditional perfect, not used after que here.", "Habríamos tenido más tiempo."]}}, {"l": "C1", "s": "c", "id": "C1-02", "tema": "Concessive subjunctive", "tipo": "Cloze", "q": "Aunque ____ mucho dinero, nunca sería feliz.", "o": ["tuviera", "tengo", "tuve", "tendré"], "c": 0, "e": "A hypothetical concession uses the imperfect subjunctive: aunque tuviera.", "x": "Aunque fuera rico, seguiría trabajando.", "tip": "aunque + subjunctive (hypothetical) · aunque + indicative (fact).", "w": {"1": ["Tengo is indicative, which would state a fact.", "Aunque tengo dinero, no soy feliz."], "2": ["Tuve is a simple past.", "Tuve mucho dinero."], "3": ["Tendré is future indicative.", "Tendré dinero algún día."]}}, {"l": "C1", "s": "c", "id": "C1-03", "tema": "Fixed expressions", "tipo": "Cloze", "q": "No tengo ni ____ de lo que dices.", "o": ["idea", "opinión", "dato", "razón"], "c": 0, "e": "No tengo ni idea is a fixed expression meaning I have no idea.", "x": "No tengo ni idea de dónde está.", "tip": "no tener ni idea = to have no clue.", "w": {"1": ["Ni opinión is not a fixed expression.", "No tengo opinión sobre eso."], "2": ["Ni dato does not form this expression.", "No tengo ese dato."], "3": ["Ni razón does not form this expression.", "Tienes razón."]}}, {"l": "C1", "s": "c", "id": "C1-04", "tema": "Verb + preposition", "tipo": "Cloze", "q": "Se opuso ____ la reforma.", "o": ["a", "de", "en", "con"], "c": 0, "e": "The verb oponerse requires the preposition a.", "x": "Se opone a la idea.", "tip": "oponerse a · insistir en · depender de · soñar con.", "w": {"1": ["Oponerse de is not correct.", "Depende de la reforma."], "2": ["Oponerse en is not correct.", "Insistió en la reforma."], "3": ["Oponerse con is not correct.", "Sueña con la reforma."]}}, {"l": "C1", "s": "c", "id": "C1-05", "tema": "Concessive subjunctive", "tipo": "Cloze", "q": "Por mucho que ____, no lo conseguirás.", "o": ["insistas", "insistes", "insistirás", "insististe"], "c": 0, "e": "Por mucho que is followed by the subjunctive: por mucho que insistas.", "x": "Por más que lo intente, no puedo.", "tip": "por mucho que / por más que + subjunctive.", "w": {"1": ["Insistes is indicative.", "Siempre insistes."], "2": ["Insistirás is future indicative.", "Insistirás mañana."], "3": ["Insististe is a simple past.", "Ayer insististe."]}}, {"l": "C1", "s": "c", "id": "C1-06", "tema": "Connectors", "tipo": "Cloze", "q": "No se presentó; ____, lo despidieron.", "o": ["en consecuencia", "no obstante", "a pesar de", "mientras tanto"], "c": 0, "e": "En consecuencia (as a result) shows cause and effect.", "x": "Llegó tarde; por lo tanto, se perdió la reunión.", "tip": "en consecuencia = therefore · no obstante = however.", "w": {"1": ["No obstante shows contrast, not result.", "Era tarde; no obstante, salimos."], "2": ["A pesar de needs a noun or infinitive and shows contrast.", "A pesar de la lluvia, salimos."], "3": ["Mientras tanto means meanwhile.", "Mientras tanto, preparo la cena."]}}, {"l": "C1", "s": "c", "id": "C1-07", "tema": "Probability + subjunctive", "tipo": "Cloze", "q": "Es probable que ____ mañana.", "o": ["llueva", "llueve", "lloverá", "llovió"], "c": 0, "e": "Es probable que is followed by the subjunctive: llueva.", "x": "Es posible que lleguen tarde.", "tip": "es probable / es posible que + subjunctive.", "w": {"1": ["Llueve is indicative.", "Hoy llueve mucho."], "2": ["Lloverá is future indicative.", "Mañana lloverá."], "3": ["Llovió is a simple past.", "Ayer llovió."]}}, {"l": "C1", "s": "c", "id": "C1-08", "tema": "Idioms", "tipo": "Cloze", "q": "Ese político siempre se va por las ____.", "o": ["ramas", "hojas", "raíces", "flores"], "c": 0, "e": "Irse por las ramas means to go off on a tangent.", "x": "No te vayas por las ramas y dime la verdad.", "tip": "irse por las ramas = to beat around the bush.", "w": {"1": ["Irse por las hojas is not an idiom.", "Las hojas caen en otoño."], "2": ["Raíces refers to roots, not this idiom.", "El árbol tiene raíces fuertes."], "3": ["Irse por las flores is not an idiom.", "Compro flores para ti."]}}, {"l": "C1", "s": "w", "id": "C1-09", "tema": "Word formation", "tipo": "Word formation", "q": "La ____ de los datos es fundamental para el estudio.", "k": "FIABLE", "sa": "La ____ de los datos es fundamental para el estudio.", "o": ["fiabilidad", "fiable", "fiablemente", "fiar"], "c": 0, "e": "After la we need a noun: fiabilidad (reliability).", "x": "Dudo de la fiabilidad de la fuente.", "tip": "adjective + -idad = noun: fiable → fiabilidad.", "w": {"1": ["Fiable is an adjective.", "Es un dato fiable."], "2": ["Fiablemente is an adverb.", "Funciona fiablemente."], "3": ["Fiar is a verb.", "No me fío de ti."]}}, {"l": "C1", "s": "w", "id": "C1-10", "tema": "Word formation", "tipo": "Word formation", "q": "Su comportamiento fue ____ en todo momento.", "k": "EJEMPLO", "sa": "Su comportamiento fue ____ en todo momento.", "o": ["ejemplar", "ejemplo", "ejemplarmente", "ejemplificar"], "c": 0, "e": "After fue we need an adjective: ejemplar (exemplary).", "x": "Es un estudiante ejemplar.", "tip": "noun + -ar = adjective: ejemplo → ejemplar.", "w": {"1": ["Ejemplo is a noun.", "Dame un ejemplo."], "2": ["Ejemplarmente is an adverb, and it does not fit after fue here.", "Se comportó ejemplarmente."], "3": ["Ejemplificar is a verb.", "Voy a ejemplificar el tema."]}}, {"l": "C1", "s": "w", "id": "C1-11", "tema": "Word formation", "tipo": "Word formation", "q": "Nadie cuestionó su ____ en el tema.", "k": "COMPETENTE", "sa": "Nadie cuestionó su ____ en el tema.", "o": ["competencia", "competente", "competentemente", "competir"], "c": 0, "e": "After su we need a noun: competencia (skill, expertise).", "x": "Admiro su competencia profesional.", "tip": "adjective + -ia = noun: competente → competencia.", "w": {"1": ["Competente is an adjective.", "Es una persona competente."], "2": ["Competentemente is an adverb.", "Trabaja competentemente."], "3": ["Competir is a verb.", "Quiero competir en la carrera."]}}, {"l": "C1", "s": "t", "id": "C1-12", "tema": "Relative cuyo", "tipo": "Key word transformation", "q": "El libro, que escribió mi abuelo, ganó un premio.\nEl libro, ____ autor es mi abuelo, ganó un premio.", "k": "CUYO", "sa": "El libro, ____ autor es mi abuelo, ganó un premio.", "o": ["cuyo", "qu
